<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STICK SOMETHING · 「贴点什么」</title><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./src/styles.css"><script defer src="./assets/vendor/lucide.min.js"></script><script type="module" src="./src/app.mjs"></script></head><body>
<div id="stick-something-design" aria-label="STICK SOMETHING 编辑器">
  <div class="ss-window">
    <div class="ss-brandbar"><span class="ss-brand">STICK SOMETHING</span><span class="ss-brand-cn">「贴点什么」</span><span class="ss-subtle">编辑器</span><div class="ss-studio" aria-label="Fatty Games"><span class="ss-studio-mark" role="img" aria-label="Fatty Games 标志"></span><div class="ss-studio-caption"><span>FATTY GAMES</span><span class="ss-studio-version" data-app-version>v0.2.1-beta.1</span></div></div></div>
    <div class="ss-chrome"><div class="ss-save-button"><button type="button" data-action="save" data-tooltip="保存 · Ctrl+S"><i data-lucide="save" aria-hidden="true"></i>保存</button><button type="button" data-action="save-menu" aria-label="保存选项" aria-haspopup="menu"><i data-lucide="chevron-down" aria-hidden="true"></i></button></div>
      <button type="button" class="cursor-interaction" data-action="new"><i data-lucide="file-plus-2" aria-hidden="true"></i>新建</button>
      <button type="button"  data-action="open"><i data-lucide="folder-open" aria-hidden="true"></i>打开</button>
      <span class="ss-separator"></span>
      <button type="button" class="cursor-interaction" data-action="undo" aria-label="撤销"><i data-lucide="undo-2" aria-hidden="true"></i></button>
      <button type="button" class="cursor-interaction" data-action="redo" aria-label="重做"><i data-lucide="redo-2" aria-hidden="true"></i></button>
      <span class="ss-separator"></span>
      <button type="button"  data-action="export">导出</button>
      <button type="button" class="cursor-interaction" data-action="canvas-settings">画布</button>
      <div class="ss-theme"><select aria-label="界面语言" data-control="language"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="zh-TW">繁體中文</option><option value="de">Deutsch</option><option value="fr">Français</option></select><select aria-label="界面主题" data-control="theme"><option value="dark">夜间 · Dark</option><option value="light">日间 · Light</option><option value="custom" hidden>导入的主题</option></select><button type="button" class="cursor-interaction" data-action="import" aria-label="导入界面主题" data-tooltip="导入 JSON 界面主题"><i data-lucide="palette" aria-hidden="true"></i></button><input type="file" accept=".json,application/json" data-control="themefile" hidden></div>
    </div>
    <div class="ss-layout">
      <div class="ss-tools" role="toolbar" aria-label="编辑工具">
        <button type="button" class="cursor-interaction" data-tool="select" aria-pressed="true"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i>选择</button>
        <button type="button" class="cursor-interaction" data-tool="split" aria-pressed="false"><i data-lucide="panels-top-left" aria-hidden="true"></i>分区</button>
        <button type="button" class="cursor-interaction" data-tool="text" aria-pressed="false"><i data-lucide="type" aria-hidden="true"></i>文字</button>
        <button type="button" class="cursor-interaction" data-tool="fill" aria-pressed="false"><i data-lucide="paint-bucket" aria-hidden="true"></i>填充</button>
      </div>
      <div class="ss-center">
        <div class="ss-doctab"><i data-lucide="file-image" aria-hidden="true"></i><button type="button" class="ss-document-name" data-display="document" aria-label="双击重命名" data-tooltip="双击重命名">专业发呆.something</button><span class="ss-subtle" data-display="file-state"></span><span class="ss-subtle">·</span><span class="ss-subtle" data-display="shape">长方形</span></div>
        <div class="ss-stage"><div class="ss-artboard" aria-label="贴纸画布，可点击选择区域"><div class="ss-artwork"></div><div class="ss-cells"></div><div class="ss-overlays"></div></div><span class="ss-subtle" data-display="size">840 × 592 px</span></div>
      </div>
      <aside class="ss-props" aria-label="区域属性">
        <div class="ss-paneltitle"><span data-display="paneltitle">区域选择</span><div><span class="ss-subtle" data-display="region">标题</span><button type="button" class="cursor-interaction" data-action="region-menu" aria-label="区域操作菜单"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div></div>
        <div class="ss-breadcrumb" aria-label="选中区域路径"></div>
        <div data-panel="canvas" hidden><div class="ss-sectiontitle">画布尺寸</div><div class="ss-pair"><div><label for="ss-canvas-width">宽度 px</label><input type="number" id="ss-canvas-width" data-control="canvas-width" min="32" max="4096" value="840"></div><div><label for="ss-canvas-height">高度 px</label><input type="number" id="ss-canvas-height" data-control="canvas-height" min="32" max="4096" value="592"></div></div><div class="ss-field"><label><input type="checkbox" data-control="lock-ratio" style="width:auto"> 锁定比例</label></div><div class="ss-field"><label>形状</label><select data-control="canvas-shape"><option value="rectangle">长方形</option><option value="ellipse">椭圆形</option></select></div><button type="button" class="cursor-interaction" data-action="resize-canvas">应用尺寸</button><div class="ss-field ss-subtle">分区按比例适应，文字重新适配</div><hr style="border:0;border-top:1px solid var(--ss-line);margin:14px 0"></div>
        <div data-panel="selection"><div class="ss-summary" data-display="selection-summary"></div><div class="ss-cutrow"><button type="button" class="cursor-interaction" data-action="edit-text">编辑文字</button><button type="button" class="cursor-interaction" data-action="edit-fill">背景填充</button></div><div class="ss-field"><button type="button" class="cursor-interaction" data-action="edit-split">划分区域</button></div></div>
        <div data-panel="content">
          <label for="ss-design-text">文字内容</label><textarea id="ss-design-text" data-control="text" maxlength="10000">专业发呆</textarea>
          <div class="ss-field"><label for="ss-design-font">字体</label><select id="ss-design-font" data-control="font"><option value="sans">黑体</option><option value="serif">宋体</option><option value="kai">楷体</option><option value="custom">自定义</option></select></div>
          <div class="ss-field ss-pair"><div><label for="ss-design-fit">文字适应</label><select id="ss-design-fit" data-control="fit"><option value="stretch">撑满宽度</option><option value="auto">自动字号</option><option value="manual">手动字号</option></select></div><div><label for="ss-design-direction">方向</label><select id="ss-design-direction" data-control="direction"><option value="horizontal">横排</option><option value="vertical">竖排</option></select></div></div>
          <div class="ss-field ss-subtle">使用系统字体，未安装时使用替代字体</div><div class="ss-field"><label for="ss-font-name">自定义字体名称</label><input id="ss-font-name" data-control="font-name" placeholder="Arial, Microsoft YaHei" maxlength="200"></div><div class="ss-field ss-pair"><div><label>字号</label><input type="number" min="4" max="1024" data-control="fontSize"></div><div><label>字重</label><select data-control="weight"><option value="400">400</option><option value="700">700</option><option value="900">900</option></select></div></div><div class="ss-field"><label>对齐</label><select data-control="align"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></div><div class="ss-field ss-pair"><div><label>字间距</label><input type="number" min="-10" max="50" data-control="letterSpacing"></div><div><label>行间距</label><input type="number" min="0.7" max="3" step="0.05" data-control="lineHeight"></div></div><div class="ss-field"><label>内边距</label><input type="number" min="0" max="256" data-control="padding"></div><div class="ss-field ss-subtle" data-display="overflow" role="status" hidden></div><div class="ss-field"><label for="ss-design-fg">文字颜色</label><div class="ss-color"><button id="ss-design-fg" type="button" class="ss-color-trigger cursor-interaction" aria-label="选择文字颜色" data-control="fg" data-color-target="fg"><span></span></button><span class="ss-colorcode" data-display="fg">#FFF5DE</span></div></div>
        </div>
        <div data-panel="colors">
          <div class="ss-sectiontitle">填充颜色</div><div class="ss-color"><button type="button" class="ss-color-trigger cursor-interaction" aria-label="选择背景颜色" data-control="bg" data-color-target="bg"><span></span></button><span class="ss-colorcode" data-display="bg">#E7291A</span></div><div class="ss-field ss-subtle">选好颜色，点击区域涂色</div>
        </div>
        <div class="ss-section" data-panel="split"><div class="ss-sectiontitle">划分选中区域</div><div class="ss-cutrow"><button type="button" class="cursor-interaction" data-action="split-y"><i data-lucide="rows-2" aria-hidden="true"></i>上下切分</button><button type="button" class="cursor-interaction" data-action="split-x"><i data-lucide="columns-2" aria-hidden="true"></i>左右切分</button></div><div class="ss-field"><label for="ss-design-count">分成几块</label><input type="number" id="ss-design-count" data-control="count" min="2" max="64" value="2"></div><div class="ss-field" data-panel="ratio" hidden><label for="ss-design-ratio">相邻分区比例 <span data-display="ratio"></span></label><input type="range" id="ss-design-ratio" data-control="ratio" min="10" max="90" value="50"></div></div>
        <div class="ss-section"><div class="ss-sectiontitle">区域操作</div><div class="ss-management"><button type="button" class="ss-delete cursor-interaction" data-action="delete-region">删除区域</button><button type="button" class="cursor-interaction" data-action="clear-text">清空文字</button></div><div class="ss-field ss-subtle" data-display="delete-hint">Delete 删除区域 · 可撤销</div></div>
      </aside>
    </div>
    <div class="ss-footer"><span data-display="tool">选择工具</span><span data-display="count">4 个区域</span><span>平面版</span><span class="ss-subtle" data-display="autosave"></span><span class="ss-feedback" role="status" aria-live="polite">选中区域后，可以继续切分</span></div>
    <div class="ss-menu" data-panel="menu" role="menu" aria-label="区域操作" hidden><button type="button" class="cursor-interaction" role="menuitem" data-action="edit-text"><span>编辑文字</span></button><button type="button" class="cursor-interaction" role="menuitem" data-action="edit-fill"><span>背景填充</span></button><button type="button" class="cursor-interaction" role="menuitem" data-action="edit-split"><span>划分区域</span></button><hr style="border:0;border-top:1px solid var(--ss-line);margin:4px 3px"><button type="button" class="cursor-interaction" role="menuitem" data-action="clear-text"><span>清空文字</span></button><button type="button" class="ss-delete cursor-interaction" role="menuitem" data-action="delete-region"><span>删除区域</span><span class="ss-shortcut">Delete</span></button></div>
    <div class="ss-picker" data-panel="color-picker" role="dialog" aria-label="颜色选择" hidden><div class="ss-picker-title"><span>颜色预览</span><span data-display="drafthex">#E7291A</span></div><button type="button" class="ss-sv" aria-label="调整饱和度和明度" data-control="sv"><span class="ss-sv-marker"></span></button><div class="ss-picker-bottom"><button type="button" data-control="eyedropper" aria-label="取色器" title="取色器"><i data-lucide="pipette" aria-hidden="true"></i></button><button type="button" class="ss-confirm-color cursor-interaction" aria-label="采用此颜色" data-control="confirm-color" data-tooltip="点击圆圈，正式采用此颜色"></button><input class="ss-hue" type="range" min="0" max="360" step="1" data-control="hue" aria-label="色相"></div><div class="ss-rgb"><div><input type="number" min="0" max="255" data-control="red" id="ss-r" aria-label="R"><label for="ss-r">R</label></div><div><input type="number" min="0" max="255" data-control="green" id="ss-g" aria-label="G"><label for="ss-g">G</label></div><div><input type="number" min="0" max="255" data-control="blue" id="ss-b" aria-label="B"><label for="ss-b">B</label></div></div><div class="ss-field"><label for="ss-hex">十六进制颜色</label><input id="ss-hex" type="text" maxlength="7" data-control="hex" value="#E7291A"></div><div class="ss-dialog-actions"><span class="ss-subtle">点击圆圈确认</span><button type="button" class="cursor-interaction" data-control="cancel-color">取消</button></div></div>
    <div class="ss-modal" data-panel="new" hidden><div class="ss-dialog" role="dialog" aria-modal="true" aria-labelledby="ss-dialog-title"><div id="ss-dialog-title" class="ss-paneltitle">新建贴纸</div><div class="ss-field"><label>项目名称</label><input data-control="project-name" maxlength="100" value="Untitled"></div><div class="ss-field"><label for="ss-design-start">起点</label><select id="ss-design-start" data-control="start"><option value="sample">专业发呆 · 样例</option><option value="black">黑底宣言</option><option value="blue">蓝白便条</option><option value="bands">彩色条带</option><option value="blank">空白画布</option></select></div><div class="ss-field ss-pair"><div><label for="ss-design-width">宽度 px</label><input id="ss-design-width" type="number" data-control="width" min="32" max="4096" value="840"></div><div><label for="ss-design-height">高度 px</label><input id="ss-design-height" type="number" data-control="height" min="32" max="4096" value="592"></div></div><div class="ss-field"><label for="ss-design-shape">形状</label><select id="ss-design-shape" data-control="shape"><option value="rectangle">长方形</option><option value="ellipse">椭圆形</option></select></div><div class="ss-dialog-actions"><button type="button" class="cursor-interaction" data-action="cancel-new">取消</button><button type="button" class="ss-primary cursor-interaction" data-action="create">创建</button></div></div></div>
  </div>
<input type="file" data-control="projectfile" accept=".json,.something.json" hidden><div class="ss-modal" data-panel="export" hidden><div class="ss-dialog" role="dialog" aria-modal="true" aria-label="导出"><div class="ss-paneltitle">导出</div><div class="ss-field ss-subtle">SVG 保留文字，字体取决于查看设备</div><div class="ss-dialog-actions"><button data-action="close-export">关闭</button><button data-action="export-svg">SVG</button><button class="ss-primary" data-action="export-png">PNG</button></div></div></div>
<div class="ss-menu ss-save-menu" data-panel="save-menu" role="menu" hidden><button type="button" role="menuitem" data-action="save"><span>保存</span><span class="ss-shortcut">Ctrl+S</span></button><button type="button" role="menuitem" data-action="save-as"><span>另存为</span><span class="ss-shortcut">Ctrl+Shift+S</span></button><button type="button" role="menuitem" data-action="folder-settings">默认保存文件夹</button></div>
<div class="ss-modal" data-panel="rename" hidden><form class="ss-dialog" data-form="rename" role="dialog" aria-modal="true" aria-label="重命名项目"><div class="ss-paneltitle">重命名项目</div><label for="ss-rename">项目名称</label><input id="ss-rename" data-control="rename" maxlength="80" autocomplete="off"><div class="ss-field ss-subtle">修改项目名称；磁盘文件名通过另存为更改</div><div class="ss-field ss-subtle" data-display="rename-error" role="alert" hidden></div><div class="ss-dialog-actions"><button type="button" data-action="cancel-rename">取消</button><button type="submit" class="ss-primary">确定</button></div></form></div>
<div class="ss-modal" data-panel="save" hidden><div class="ss-dialog" role="dialog" aria-modal="true" aria-label="另存为"><div class="ss-paneltitle">另存为</div><label for="ss-save-name">项目名称</label><input id="ss-save-name" data-control="save-name" maxlength="80"><div class="ss-field"><label>默认保存文件夹</label><div class="ss-save-location" data-display="save-folder"></div></div><div class="ss-field ss-subtle" data-display="save-help"></div><div class="ss-field"><button type="button" data-action="choose-folder"><i data-lucide="folder-open" aria-hidden="true"></i>设置默认文件夹</button></div><div class="ss-dialog-actions ss-save-actions"><button type="button" data-action="cancel-save">取消</button><button type="button" data-action="download-copy">下载副本</button><button type="button" class="ss-primary" data-action="save-to-file">选择路径并保存</button></div></div></div>
</div>
</body></html>
